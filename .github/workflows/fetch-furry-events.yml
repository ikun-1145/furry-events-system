name: Fetch Furry Events
# Odd dates of each month at 02:00 UTC; NOT a rolling 48-hour interval.
on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason (does not override freeze)'
        required: false
permissions:
  contents: read
concurrency:
  group: furry-production-sync
  cancel-in-progress: false
jobs:
  trigger-edge-function:
    # Fail closed for BOTH events. Missing variable means frozen.
    if: ${{ vars.FCC_SYNC_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call approved FCC sync once
        env:
          FCC_SYNC_ENABLED: ${{ vars.FCC_SYNC_ENABLED }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FUNCTION_SECRET: ${{ secrets.FUNCTION_SECRET }}
        run: bash scripts/trigger-sync.sh
