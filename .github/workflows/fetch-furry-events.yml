name: Fetch Furry Events
on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcc-first-sync-manual
  cancel-in-progress: false

jobs:
  trigger-edge-function:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call FCC sync once
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FUNCTION_SECRET: ${{ secrets.FUNCTION_SECRET }}
        run: |
          set -euo pipefail
          set +x
          [[ "$SUPABASE_FUNCTION_URL" == 'https://klyrasrqgxijwrxuoevj.supabase.co/functions/v1/fetch-furry-events' ]] || { echo 'Unexpected sync endpoint'; exit 1; }
          python3 scripts/fcc-manual-trigger.py
