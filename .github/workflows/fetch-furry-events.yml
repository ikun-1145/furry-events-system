# ============================================================
# 兽聚信息聚合系统 · 定时任务（GitHub Actions）
# 文件: .github/workflows/fetch-furry-events.yml
#
# 触发频率: 每天 UTC 02:00（北京时间 10:00）和 14:00（22:00）
# 所需 Secrets（在仓库 Settings → Secrets → Actions 中配置）:
#   SUPABASE_FUNCTION_URL  → https://<project-ref>.supabase.co/functions/v1/fetch-furry-events
#   SUPABASE_ANON_KEY      → Supabase anon JWT（仅用于函数网关认证）
#   FUNCTION_SECRET        → 与 Edge Function 环境变量相同的密钥
# ============================================================

name: Fetch Furry Events

on:
  # 定时触发：每天 02:00 和 14:00 UTC
  schedule:
    - cron: "0 2,14 * * *"

  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: "触发原因（可选）"
        required: false
        default: "manual"

jobs:
  trigger-edge-function:
    name: Trigger Supabase Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call fetch-furry-events Edge Function
        id: call
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNCTION_SECRET: ${{ secrets.FUNCTION_SECRET }}
        run: |
          HTTP_STATUS=$(curl --silent --show-error \
            --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --output /tmp/response.json --write-out "%{http_code}" \
            --request POST "$SUPABASE_FUNCTION_URL" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "x-function-secret: $FUNCTION_SECRET" \
            --header "x-sync-trigger: scheduled" \
            --data '{}')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json | jq . || cat /tmp/response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Edge Function returned $HTTP_STATUS"
            exit 1
          fi

          jq -e '
            .success == true
            and (.fetched | type == "number")
            and (.upserted | type == "number")
            and (.deactivated | type == "number")
            and (.errors == [])
          ' /tmp/response.json >/dev/null

      - name: Print summary
        if: always()
        run: |
          echo "## 执行摘要" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/response.json | jq . >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no response)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
