name: Backend offline checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run test:postgrest
      - run: npm run typecheck
      - run: npm run build
      - run: npx deno lint supabase/functions workers/sunland-data-worker/src
      - run: npx deno check supabase/functions/fetch-furry-events/index.ts supabase/functions/furry-event-search/index.ts supabase/functions/furry-event-image/index.ts
# No deployment job, production credentials or sync invocation.
