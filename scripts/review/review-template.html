<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>历史活动人工审核</title><style>
:root{font-family:system-ui,sans-serif;color:#1b2736;background:#f3f6f9}body{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}header,.card{background:white;border:1px solid #d9e2eb;border-radius:12px;padding:20px;margin-bottom:14px}.note{color:#516273;line-height:1.6}.badge{background:#e9f0f8;color:#24496e;border-radius:20px;padding:4px 10px;font-size:13px}.old,.candidate{border:1px solid #dce4eb;border-radius:8px;padding:12px;margin:10px 0}.candidate{background:#f9fbfd}dl{display:grid;grid-template-columns:95px 1fr;gap:5px;margin:8px 0;overflow-wrap:anywhere}dt{color:#56677a}dd{margin:0}select,button,input{font:inherit;padding:9px;border:1px solid #b3c2d0;border-radius:6px}select{max-width:100%}button{background:#214b75;color:white;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.warning{color:#9b2c20;font-weight:600}.toolbar{position:sticky;top:0;background:#f3f6f9;padding:12px 0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{font-size:13px;color:#53677a}@media(max-width:600px){body{padding:12px}dl{grid-template-columns:70px 1fr}.card{padding:14px}}
</style></head><body><header><h1>历史活动人工审核</h1><p class="note">32 条旧活动默认全部待审核。候选是线索，不能证明身份；同一个 FCC UUID 不能关联多个旧 ID。页面离线运行，不写数据库。请先查看每条候选的完整证据，再选择决定。</p><p id="load-status" role="status" aria-live="polite">正在加载审核数据。如果一直没有显示卡片，请启用 JavaScript 并重新打开此文件。</p><noscript><p class="warning">无法运行审核页面：请在 Safari 设置中启用 JavaScript。</p></noscript><p class="muted" id="snapshot"></p><p class="muted">“独立保留”仅表示保留旧活动，不自动批准任何 FCC 活动作为新活动。请定期导出 JSON；重新打开页面可导入之前的审核文件。</p></header><div class="toolbar"><button id="export">导出审核 JSON</button><label>选择证据或已有审核 JSON <input id="import" type="file"></label><span id="summary"></span></div><p id="errors" class="warning" role="alert"></p><main id="cards"></main><script>
window.addEventListener('error',function(){var s=document.getElementById('load-status');if(s)s.textContent='页面运行或渲染出错。请重新打开文件；若仍失败，请使用新版 Safari。';});
window.addEventListener('unhandledrejection',function(){var s=document.getElementById('load-status');if(s)s.textContent='文件处理失败。请重新选择文件。';});
</script><script>
/* REVIEW_DATA */
'use strict';
const decisions=new Map(DATA.rows.map(r=>[r.id,{historical_id:r.id,decision:'pending',fcc_id:null,reviewed_at:null}]));
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
const fmt=v=>v===null||v===undefined||v===''?'未提供':String(v);
const labels={name:'名称',start_at:'开始时间',end_at:'结束时间',city:'地区',venue:'地点',organization:'主办方'};
const evidenceLabels={name_exact:'名称相同',name_contains:'名称包含',date_exact:'日期相同',city_exact:'地区相同',organization_exact:'主办方相同',venue_exact:'地点相同'};
const flagLabels={date_diff:'日期不同',name_diff:'名称不同',many_history_candidates:'同一 FCC 活动也是其他旧记录的候选',one_history_multiple_candidates:'该旧记录有多个候选',status_cancelled:'FCC 已取消',status_postponed:'FCC 已延期',status_rescheduled:'FCC 已改期',status_movedOnline:'FCC 已转线上'};
function details(x,includeId){const d=el('dl');if(includeId){d.append(el('dt','FCC UUID'),el('dd',x.fcc_id))}for(const [key,label] of Object.entries(labels)){d.append(el('dt',label),el('dd',fmt(x[key])))}if(includeId)d.append(el('dt','FCC 状态'),el('dd',fmt(x.status)));return d}
const cards=document.getElementById('cards'),summary=document.getElementById('summary'),errors=document.getElementById('errors'),exportButton=document.getElementById('export');document.getElementById('snapshot').textContent='证据版本 SHA-256：'+DATA.evidence_id+'；快照日期：'+DATA.snapshot_time+'。FCC 与历史数据可能已变化。';
function update(){const selected=new Map();for(const d of decisions.values())if(d.decision==='link'&&d.fcc_id){if(!selected.has(d.fcc_id))selected.set(d.fcc_id,[]);selected.get(d.fcc_id).push(d.historical_id)}const conflicts=[...selected.entries()].filter(([,ids])=>ids.length>1);const missing=[...decisions.values()].filter(d=>d.decision==='link'&&!d.fcc_id);errors.textContent=conflicts.map(([id,ids])=>'冲突：FCC '+id+' 被旧 ID '+ids.join('、')+' 同时选择。').concat(missing.map(d=>'旧 ID '+d.historical_id+' 尚未选择候选。')).join(' ');exportButton.disabled=conflicts.length>0||missing.length>0;const counts={pending:0,link:0,keep_legacy:0};for(const d of decisions.values())counts[d.decision]++;summary.textContent=`待审核 ${counts.pending} · 已选关联 ${counts.link} · 独立保留 ${counts.keep_legacy}`}
function render(){while(cards.firstChild)cards.removeChild(cards.firstChild);for(const row of DATA.rows){const d=decisions.get(row.id),card=el('section',undefined,'card');card.dataset.id=row.id;card.append(el('h2',`旧活动 #${row.id} · ${fmt(row.name)}`));card.append(el('span',(row.is_active?'启用':'停用')+' · '+(row.flags||[]).map(x=>flagLabels[x]||x).join(' '),'badge'));const old=el('div',undefined,'old');old.append(details(row,false));card.append(old);if(!row.candidates.length)card.append(el('p','没有规则命中的候选；不代表 FCC 没有对应活动。','note'));for(const c of row.candidates){const block=el('div',undefined,'candidate');block.append(el('strong',`候选 ${c.rank} · ${c.strength==='high_candidate'?'较强线索':'待核实线索'}（非身份确认）`));block.append(details(c,true));block.append(el('p','排序与依据：'+(c.evidence.map(x=>evidenceLabels[x]||x).join('、')||'无')+'；按较强线索优先、证据数量排序。','muted'));if(c.flags.length)block.append(el('p','差异/冲突：'+c.flags.map(x=>flagLabels[x]||x).join('；'),'warning'));card.append(block)}
const title=el('label','人工决定：');const action=el('select');action.setAttribute('aria-label','旧 ID '+row.id+' 的决定');for(const [v,t] of [['pending','待审核 / 暂不确定'],['link','确认关联指定 FCC UUID'],['keep_legacy','独立保留旧活动']]){const o=el('option',t);o.value=v;action.append(o)}action.value=d.decision;title.append(action);card.append(title);const choice=el('select');choice.setAttribute('aria-label','旧 ID '+row.id+' 的 FCC 候选');const empty=el('option','请选择候选');empty.value='';choice.append(empty);for(const c of row.candidates){const o=el('option',`${c.rank}. ${fmt(c.name)} · ${c.fcc_id}`);o.value=c.fcc_id;choice.append(o)}choice.value=d.fcc_id||'';choice.hidden=d.decision!=='link';card.append(' ',choice);action.addEventListener('change',()=>{d.decision=action.value;d.fcc_id=null;d.reviewed_at=d.decision==='pending'?null:new Date().toISOString();choice.value='';choice.hidden=d.decision!=='link';update()});choice.addEventListener('change',()=>{d.fcc_id=choice.value||null;d.reviewed_at=new Date().toISOString();update()});cards.append(card)}update()}
exportButton.addEventListener('click',()=>{update();if(exportButton.disabled)return;const o={schema:'fcc-review-decisions-v1',evidence_id:DATA.evidence_id,snapshot_time:DATA.snapshot_time,exported_at:new Date().toISOString(),decisions:[...decisions.values()]};const url=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='fcc-review-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
function setLoadStatus(message){document.getElementById('load-status').textContent=message}
function renderSafely(){try{render();var n=DATA.rows.reduce(function(sum,row){return sum+row.candidates.length},0);setLoadStatus('已加载 '+DATA.rows.length+' 条历史活动、'+n+' 个候选。');return true}catch(err){setLoadStatus('卡片渲染失败，请重新打开页面；已有审核决定未被导出。');return false}}
function readSelectedFile(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){if(typeof reader.result==='string')resolve(reader.result);else reject(new Error('READ_FAILED'))};reader.onerror=function(){reject(new Error('READ_FAILED'))};reader.onabort=function(){reject(new Error('READ_ABORTED'))};try{reader.readAsText(file,'UTF-8')}catch(e){reject(new Error('READ_FAILED'))}})}
function stable(value){if(Array.isArray(value))return '['+value.map(stable).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(function(k){return JSON.stringify(k)+':'+stable(value[k])}).join(',')+'}';return JSON.stringify(value)}
function validateDecisionFile(x){if(x.schema!=='fcc-review-decisions-v1'||x.evidence_id!==DATA.evidence_id||x.snapshot_time!==DATA.snapshot_time||!Array.isArray(x.decisions)||x.decisions.length!==DATA.rows.length)throw new Error('DECISION_VERSION');var seen=new Set();for(const d of x.decisions){const r=DATA.rows.find(r=>r.id===d.historical_id);if(!r||seen.has(r.id)||!['pending','link','keep_legacy'].includes(d.decision)||(d.decision==='link'&&!r.candidates.some(c=>c.fcc_id===d.fcc_id))||(d.decision!=='link'&&d.fcc_id!==null)||(d.decision==='pending'?d.reviewed_at!==null:typeof d.reviewed_at!=='string'||!Number.isFinite(Date.parse(d.reviewed_at))))throw new Error('DECISION_INVALID');seen.add(r.id)}return x.decisions}
document.getElementById('import').addEventListener('click',function(){setLoadStatus('请选择 evidence.json 或已导出的审核 JSON。');});
document.getElementById('import').addEventListener('cancel',function(){setLoadStatus('未选择文件；已加载的数据保持不变。');});
document.getElementById('import').addEventListener('change',async function(e){
 const file=e.target.files&&e.target.files[0];if(!file){setLoadStatus('未选择文件；已加载的数据保持不变。');return}
 errors.textContent='';setLoadStatus('正在读取所选文件…');
 try{const text=await readSelectedFile(file);let x;try{x=JSON.parse(text)}catch(err){throw new Error('JSON_INVALID')}
 if(x&&x.schema==='fcc-review-evidence-v1'){
  const expected={schema:DATA.schema,snapshot_time:DATA.snapshot_time,scope:DATA.scope,rows:DATA.rows};
  if(stable(x)!==stable(expected))throw new Error('EVIDENCE_MISMATCH');
  if(renderSafely())setLoadStatus('证据校验通过。已加载 '+DATA.rows.length+' 条历史活动、'+DATA.rows.reduce((n,r)=>n+r.candidates.length,0)+' 个候选；已有审核决定保持不变。');
 }else if(x&&x.schema==='fcc-review-decisions-v1'){
  const list=validateDecisionFile(x);for(const d of list)decisions.set(d.historical_id,{historical_id:d.historical_id,decision:d.decision,fcc_id:d.fcc_id,reviewed_at:d.reviewed_at});
  if(renderSafely())setLoadStatus('审核决定导入成功。已加载 '+DATA.rows.length+' 条历史活动、'+DATA.rows.reduce((n,r)=>n+r.candidates.length,0)+' 个候选；请检查冲突提示。');
 }else throw new Error('FILE_KIND');
 }catch(err){const code=err&&err.message;const msg=code==='JSON_INVALID'?'JSON 格式无效，请选择未损坏的文件。':code==='EVIDENCE_MISMATCH'?'证据内容与本页面版本不一致，未加载。':code==='DECISION_VERSION'?'审核决定的证据版本或记录数不匹配，未导入。':code==='DECISION_INVALID'?'审核决定包含无效记录或候选，未导入。':code==='FILE_KIND'?'文件类型不匹配：请选择 evidence.json 或已导出的审核 JSON。':code==='READ_ABORTED'?'文件读取已取消，请重新选择。':'文件读取或处理失败，请从“文件”中重新选择并确认文件已下载到本机。';errors.textContent=msg;setLoadStatus('未完成导入：'+msg)}
 finally{e.target.value=''}
});

renderSafely();
</script></body></html>
